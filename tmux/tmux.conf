# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse
set -g mouse on

# Colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"  # true color support for the theme below

# History
set -g history-limit 100000

# Status bar position
set -g status-position top

# Splits (open in current pane's directory)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable, no need to re-tap prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind p previous-window
bind n next-window
bind -n M-Left previous-window
bind -n M-Right next-window

# Pane zoom toggle
bind z resize-pane -Z

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Lower escape-time so vim/neovim doesn't feel laggy inside tmux
set -sg escape-time 10

# =============================================================================
# Theme: Rosé Pine Moon
# =============================================================================
thm_base="#232136"
thm_surface="#2a273f"
thm_overlay="#393552"
thm_muted="#6e6a86"
thm_subtle="#908caa"
thm_text="#e0def4"
thm_love="#eb6f92"
thm_gold="#f6c177"
thm_rose="#ea9a97"
thm_pine="#3e8fb0"
thm_foam="#9ccfd8"
thm_iris="#c4a7e7"

set -g status-style "bg=#{thm_base},fg=#{thm_text}"

# Window tabs
set -g window-status-style "fg=#{thm_muted},bg=#{thm_base}"
set -g window-status-format " #I:#W "
set -g window-status-current-style "fg=#{thm_base},bg=#{thm_gold},bold"
set -g window-status-current-format " #I:#W "
set -g window-status-activity-style "fg=#{thm_love},bg=#{thm_base}"
set -g window-status-bell-style "fg=#{thm_love},bg=#{thm_base},bold"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#{thm_overlay}"
set -g pane-active-border-style "fg=#{thm_iris}"

# Status bar left/right
set -g status-left ""
set -g status-left-length 0

set -g status-right-length 100
set -g status-right "#[fg=#{thm_subtle},bg=#{thm_base}]#[fg=#{thm_base},bg=#{thm_subtle}] %H:%M  %d-%b #[fg=#{thm_pine},bg=#{thm_base}]#[fg=#{thm_base},bg=#{thm_pine},bold] #h "

set -g status-justify left

# Messages
set -g message-style "fg=#{thm_gold},bg=#{thm_surface}"
set -g message-command-style "fg=#{thm_gold},bg=#{thm_surface}"
